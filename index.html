<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typecast - Film Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Futura+PT:wght@500&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="style.css">
</head>
   
<body>
  <!-- HOME PAGE -->
  <div id="home-page" class="page active">
    <div class="quiz-card">
      <h1 class="quiz-title">typecast</h1>
      <p class="quiz-description">A film quiz that will sort you into an archetype of the cinematic experience you are drawn to.</p>
      
      <div class="quiz-image">
        <img src="images/homepage hero photo.png" alt="Home hero photo">
      </div>
      
      <button class="enter-btn" onclick="startQuiz()">Enter</button>
      
      <p class="footer-text">Made by Tarini Bahadur<br>Check out more on @designbytarini!</p>
    </div>
  </div>

  <!-- QUIZ CONTAINER (questions will be generated by JavaScript) -->
  <div id="quiz-container"></div>

  <!-- RESULTS PAGE -->
  <div id="results-page" class="page">
    <div class="quiz-card results-card">
      <p class="result-header">Your archetype!<br>Press down to save and share</p>
      
      <div class="result-content">
        <img id="result-image" src="" alt="Your result" class="result-image">
        <h2 id="result-title" class="result-title"></h2>
        <p id="result-description" class="result-description"></p>
      </div>
      
      <p class="footer-text">Designed and created by Tarini Bahadur<br>Check out more on @designbytarini!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
